# OpenGPS on Dokploy.
#
# Dokploy → Projects → Create Service → Compose, from this repository, with
# Compose Path:
#   ./deploy/dokploy/docker-compose.yml
#
# Variables: paste them in the Environment tab. Three are required
# (PUBLIC_URL, AUTH_SECRET and POSTGRES_PASSWORD); `sh deploy/generate-env.sh
# https://<domain>` prints them with the secrets already generated. Without
# them the deploy stops with a message. The rest of the platform is set up
# from its console. Every variable is in deploy/.env.example.
#
# Domain: under Domains, add the domain to the `opengps` service on port 3000,
# with HTTPS. Dokploy's proxy holds the domain and its certificate; the
# platform serves the web app and the API on that port. Nothing of it is published to
# the host, and neither is the database.
#
# GPS devices: they do not go through Dokploy's proxy. Their ports are
# published to the host, so gw.<domain> is a DNS record straight to the server
# ("DNS only" in Cloudflare) and the server's firewall opens them, TCP and UDP.
#
# Nothing is mounted from the repository. The images come built from
# ghcr.io, for Intel/AMD and ARM, in the version written in them, the last one
# released on main (ADR-0008): to install a new one, Deploy again. The guide is
# deploy/README.md.

# Which way of installing this file is (deploy/<this>).
x-opengps-deploy: dokploy

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ghcr.io/afigueroahn/opengps-postgres:0.4.0
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    environment:
      # The only user (postgres by default) and the platform's database (opengps). The gateway's, traccar, is
      # created on first start. All three only take effect then.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Environment tab (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-opengps}
      # Memory Postgres may assume it owns when it tunes itself on first start. Empty = all of the server's.
      TS_TUNE_MEMORY: ${POSTGRES_TUNE_MEMORY:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Ready when both databases answer a query with the password, the way the platform and the gateway connect:
      # by the container's own network address, since Postgres lets 127.0.0.1 in without one. During its first
      # start Postgres answers by no address, only inside its container, while it prepares the databases.
      test:
        - CMD-SHELL
        - >
          PGPASSWORD="$$POSTGRES_PASSWORD"
          psql -h "$$(hostname)" -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opengps} -c 'SELECT 1' > /dev/null &&
          PGPASSWORD="$$POSTGRES_PASSWORD"
          psql -h "$$(hostname)" -U ${POSTGRES_USER:-postgres} -d traccar -c 'SELECT 1' > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  traccar:
    image: traccar/traccar:6.17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      # Traccar reads its configuration from environment variables: `database.url` -> DATABASE_URL.
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Environment tab (openssl rand -hex 32)}
      DATABASE_MAX_POOL_SIZE: "10"
      # Only devices registered by the platform are accepted.
      DATABASE_REGISTER_UNKNOWN: "false"
      # Traccar holds each position for 3 s to sort it; the platform already sorts by GPS time.
      SERVER_BUFFERING_THRESHOLD: "0"
      JAVA_TOOL_OPTIONS: ${TRACCAR_JAVA_OPTS:-}
      GEOCODER_ENABLE: "false"
    ports:
      # The devices connect here, by TCP and UDP. One port per protocol family.
      - "5001:5001"       # gps103 (Coban)
      - "5001:5001/udp"
      - "5002:5002"       # tk103
      - "5002:5002/udp"
      - "5004:5004"       # gl200 (Queclink)
      - "5004:5004/udp"
      - "5011:5011"       # suntech
      - "5011:5011/udp"
      - "5013:5013"       # h02 (SinoTrack, MiCODUS)
      - "5013:5013/udp"
      - "5015:5015"       # jt808
      - "5015:5015/udp"
      - "5023:5023"       # gt06 (Concox / Jimi)
      - "5023:5023/udp"
      - "5027:5027"       # teltonika
      - "5027:5027/udp"
      - "5046:5046"       # ruptela
      - "5046:5046/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/api/server || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  opengps:
    # The backend with the web app inside, on the same port.
    image: ghcr.io/afigueroahn/opengps:0.4.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      traccar:
        condition: service_started
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in the Environment tab, the address of the web app (https://example.com)}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the Environment tab (openssl rand -hex 32)}
      APP_NAME: ${APP_NAME:-OpenGPS}
      # Whose releases are newer versions of this one. Empty turns the look off.
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY-afigueroahn/OpenGPS}
      # Everything with the database's only user: the platform, the gateway's positions and the backups.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opengps}
      TRACCAR_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/traccar
      TRACCAR_API_URL: http://traccar:8082
    volumes:
      - files-data:/data/files
      - backups-data:/data/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  files-data:
  backups-data:
