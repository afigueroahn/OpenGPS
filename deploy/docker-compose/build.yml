# Builds the images from the code instead of downloading them: to develop, or
# to try a change before it is released. From the repository:
#
#   docker compose -f deploy/docker-compose/docker-compose.yml -f deploy/docker-compose/build.yml up -d --build
#
# OPENGPS_VERSION only names the images built here; the platform shows the
# repository's version with -dev.
services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/postgres.Dockerfile
  opengps:
    build:
      context: ../..
      dockerfile: deploy/opengps.Dockerfile
  helper:
    build:
      context: ../..
      dockerfile: deploy/helper.Dockerfile
