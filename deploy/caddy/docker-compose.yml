# OpenGPS with Docker Compose and Caddy, which brings the domain with HTTPS:
# it gets and renews the certificate by itself. Each release attaches this
# file as docker-compose.caddy.yml, with generate-env.sh and env.example:
#
#   sh generate-env.sh https://example.com .env
#   docker compose up -d
#
# Its variables are in deploy/.env.example: PUBLIC_URL, AUTH_SECRET and
# POSTGRES_PASSWORD; the rest of the platform is set up from its console. The
# images come built, for Intel/AMD and ARM, from ghcr.io, in the version written
# in them (ADR-0008); deploy/build.yml builds them from the code instead. The
# guide is deploy/README.md. It needs Docker Compose 2.23.1 or later: Caddy's
# configuration goes inside this file.
#
# Published to the host: the ports the GPS devices connect to, and 80 and 443
# for the web app, which the `caddy` service takes to http://opengps:3000. The
# domain's DNS record points to this server and both ports must reach it, for
# the certificate. PostgreSQL and the Traccar API are only accessible inside
# the Docker network.

name: ${COMPOSE_PROJECT_NAME:-opengps}

# Which way of installing this file is (deploy/<this>): the helper keeps it when it installs a version.
x-opengps-deploy: caddy

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ghcr.io/afigueroahn/opengps-postgres:0.10.0
    restart: unless-stopped
    logging: *logging
    shm_size: 256m
    environment:
      # The only user (postgres by default) and the platform's database (opengps). The gateway's, traccar, is
      # created on first start. All three only take effect then.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-opengps}
      # Memory Postgres may assume it owns when it tunes itself on first start. Empty = all of the server's.
      TS_TUNE_MEMORY: ${POSTGRES_TUNE_MEMORY:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Ready when both databases answer a query with the password, the way the platform and the gateway connect:
      # by the container's own network address, since Postgres lets 127.0.0.1 in without one. During its first
      # start Postgres answers by no address, only inside its container, while it prepares the databases.
      test:
        - CMD-SHELL
        - >
          PGPASSWORD="$$POSTGRES_PASSWORD"
          psql -h "$$(hostname)" -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-opengps} -c 'SELECT 1' > /dev/null &&
          PGPASSWORD="$$POSTGRES_PASSWORD"
          psql -h "$$(hostname)" -U ${POSTGRES_USER:-postgres} -d traccar -c 'SELECT 1' > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  traccar:
    image: traccar/traccar:6.17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      # Traccar reads its configuration from environment variables: `database.url` -> DATABASE_URL.
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://postgres:5432/traccar
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (openssl rand -hex 32)}
      DATABASE_MAX_POOL_SIZE: "10"
      # Only devices registered by the platform are accepted.
      DATABASE_REGISTER_UNKNOWN: "false"
      # Traccar holds each position for 3 s to sort it; the platform already sorts by GPS time.
      SERVER_BUFFERING_THRESHOLD: "0"
      JAVA_TOOL_OPTIONS: ${TRACCAR_JAVA_OPTS:-}
      GEOCODER_ENABLE: "false"
    ports:
      # The devices connect here, by TCP and UDP. One port per protocol family.
      - "5001:5001" # gps103 (Coban)
      - "5001:5001/udp"
      - "5002:5002" # tk103
      - "5002:5002/udp"
      - "5004:5004" # gl200 (Queclink)
      - "5004:5004/udp"
      - "5011:5011" # suntech
      - "5011:5011/udp"
      - "5013:5013" # h02 (SinoTrack, MiCODUS)
      - "5013:5013/udp"
      - "5015:5015" # jt808
      - "5015:5015/udp"
      - "5023:5023" # gt06 (Concox / Jimi)
      - "5023:5023/udp"
      - "5027:5027" # teltonika
      - "5027:5027/udp"
      - "5046:5046" # ruptela
      - "5046:5046/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8082/api/server || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true

  opengps:
    # The backend with the web app inside, on the same port.
    image: ghcr.io/afigueroahn/opengps:0.10.0
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
      traccar:
        condition: service_started
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL, the address of the web app (https://example.com)}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (openssl rand -hex 32)}
      APP_NAME: ${APP_NAME:-OpenGPS}
      # Whose releases are newer versions of this one. Empty turns the look off.
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY-afigueroahn/OpenGPS}
      # Everything with the database's only user: the platform, the gateway's positions and the backups.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-opengps}
      TRACCAR_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/traccar
      TRACCAR_API_URL: http://traccar:8082
    volumes:
      - files-data:/data/files
      - backups-data:/data/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true

  # Installs a new version when the console asks for it (deploy/helper.sh,
  # ADR-0004): brings up the new version's images and compose file, and goes
  # back to what there was if the platform does not start. It is the only
  # service with access to Docker, through its socket, and it opens no port.
  # It sees this folder, with docker-compose.yml and .env, to install versions.
  # Restoring a backup the platform does by itself (ADR-0009).
  helper:
    image: ghcr.io/afigueroahn/opengps-helper:0.10.0
    restart: unless-stopped
    logging: *logging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - backups-data:/data/backups
      - .:/data/install
    security_opt:
      - no-new-privileges:true

  # The proxy with HTTPS. Caddy gets the certificate of its site and renews it
  # by itself, and takes it to http://opengps:3000. An http:// site gets no
  # certificate.
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    logging: *logging
    depends_on:
      opengps:
        condition: service_started
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
    # The site Caddy serves is the address of PUBLIC_URL: the web app and the mobile apps use the same
    # one. As a variable of the service, changing PUBLIC_URL restarts Caddy.
    command:
      - /bin/sh
      - -c
      - |
        SITE="$${PUBLIC_URL%/}"
        export SITE
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # The certificates and their keys: they must outlive the container.
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true

configs:
  caddyfile:
    # {$$SITE} reaches Caddy as {$SITE}: its own way of reading a variable.
    content: |
      {$$SITE} {
        reverse_proxy opengps:3000
      }

volumes:
  postgres-data:
  files-data:
  backups-data:
  caddy-data:
  caddy-config:
