packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
# The mobile app stays on Expo SDK 55 (ADR-0015): the fixed versions its tools
# accept, and the two notices of decode-uri-component, whose fix breaks the app.
overrides:
  "glob@>=9 <14.0.2": ^14.0.2
  "minimatch@>=7 <11.0.1": ^11.0.1
  "zod@<4.6.6": ^4.6.6
auditConfig:
  ignoreGhsas:
    - GHSA-vcc3-ghjq-m6fr
    - GHSA-qr28-fpjm-wq7f
