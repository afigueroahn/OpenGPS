name: Bug
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: Versión publicada o hash del commit donde ocurre.
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Docker, navegador y cualquier otro dato relevante.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Pega los logs relevantes. Quita antes secretos y datos personales.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, videos o enlaces que muestren el problema.
    validations:
      required: true
